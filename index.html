<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GroupConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0ff;background:#08111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#18345d 0,#08111f 42%,#050a12 100%)}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:24px}.brand{font-weight:800;font-size:25px;letter-spacing:-.5px}.brand span{color:#62a8ff}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.card{background:rgba(15,27,47,.86);border:1px solid #233653;border-radius:20px;box-shadow:0 18px 60px #0005;backdrop-filter:blur(12px)}.auth{max-width:460px;margin:7vh auto;padding:30px}.muted{color:#91a3bd}.title{font-size:34px;margin:0 0 8px}.sub{margin:0 0 25px;color:#91a3bd}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab,.btn{border:0;border-radius:11px;padding:11px 15px;cursor:pointer}.tab{background:#12223b;color:#aebed5}.tab.active,.btn{background:#347eea;color:white}.field{display:grid;gap:7px;margin:12px 0}.field input{width:100%;padding:13px;border-radius:11px;border:1px solid #304666;background:#0a1628;color:white;outline:none}.btn{width:100%;font-weight:700}.error{color:#ff9c9c;margin:10px 0}.app{display:grid;grid-template-columns:260px 1fr;gap:16px}.side{padding:18px}.main{min-height:72vh;display:flex;flex-direction:column}.group{padding:14px;border-radius:14px;background:#12223b;margin-top:14px}.group b{display:block}.nav{display:grid;gap:8px;margin-top:18px}.nav button{background:transparent;color:#b9c8dd;text-align:left;border:0;padding:11px;border-radius:10px;cursor:pointer}.nav button:hover{background:#12223b}.chathead{padding:18px 20px;border-bottom:1px solid #233653;display:flex;justify-content:space-between}.messages{padding:20px;flex:1;overflow:auto}.msg{max-width:72%;padding:10px 13px;border-radius:14px;background:#12223b;margin:8px 0}.mine{margin-left:auto;background:#347eea}.composer{display:flex;gap:10px;padding:15px;border-top:1px solid #233653}.composer input{flex:1;padding:13px;border-radius:12px;border:1px solid #304666;background:#0a1628;color:white}.composer .btn{width:auto}.pill{font-size:12px;color:#8fb9ff}.invite{padding:12px;background:#0a1628;border:1px dashed #38587f;border-radius:12px;margin-top:10px;word-break:break-all}.logout{background:#182a45;color:#c8d5e7}.hidden{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.shell{padding:14px}.auth{margin:4vh auto;padding:22px}.title{font-size:29px}}
</style></head>
<body>
<div class="shell">
<div class="top"><div class="brand">Group<span>Connect</span></div><button id="logout" class="tab logout hidden">Sign out</button></div>
<section id="auth" class="card auth">
<h1 class="title">Private group chat.</h1><p class="sub">Connect only with the people invited to your group.</p>
<div class="tabs"><button id="loginTab" class="tab active">Sign in</button><button id="signupTab" class="tab">Create account</button></div>
<form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required></div><div id="nameField" class="field hidden"><label>Display name</label><input id="name"></div><button class="btn" id="authBtn">Sign in</button><div id="authMsg" class="error"></div></form>
</section>
<section id="welcome" class="card auth hidden"><h2>Join or create a group</h2><p class="sub">You can only enter a group with its private invitation code.</p><div class="field"><label>Invitation code</label><input id="inviteInput" placeholder="Paste invitation code"></div><button id="joinBtn" class="btn">Join private group</button><div style="height:10px"></div><div class="field"><label>Or create your own group</label><input id="newGroupName" placeholder="e.g. CS30 Students"></div><button id="createBtn" class="btn">Create group</button><div id="joinMsg" class="error"></div></section>
<section id="app" class="app hidden">
<aside class="card side"><h3>My Group</h3><div id="groupBox" class="group"><span class="muted">Loading…</span></div><div class="nav"><button id="copyInvite">🔗 Copy invite</button><button id="membersBtn">👥 Members</button><button id="adminBtn">⚙️ Group settings</button></div></aside>
<main class="card main"><div class="chathead"><div><b id="groupName">Group chat</b><div class="pill" id="memberCount"></div></div><div class="pill" id="status">Connecting…</div></div><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="message" placeholder="Write a message…" autocomplete="off"><button class="btn">Send</button></form></main>
</section>
</div>
<script>
// 1) Create a Supabase project.
// 2) Run supabase/schema.sql in SQL Editor.
// 3) Replace these two values with your project's URL and publishable key.
const SUPABASE_URL='https://dvaycvydjwiemrrphnwu.supabase.co';
const SUPABASE_KEY='sb_publishable_vESp7-SluHlUuknkEcepew_tJOqjHok';
const ready=SUPABASE_URL.startsWith('http') && !SUPABASE_KEY.startsWith('YOUR_');
const sb=ready?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let mode='login', user=null, group=null, channel=null;
const $=id=>document.getElementById(id);
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('nameField').classList.toggle('hidden',m==='login');$('authBtn').textContent=m==='login'?'Sign in':'Create account';$('authMsg').textContent='';}
$('authForm').onsubmit=async e=>{e.preventDefault();if(!ready)return $('authMsg').textContent='Add your Supabase URL and publishable key in index.html first.';const email=$('email').value.trim(),password=$('password').value;let r;if(mode==='login')r=await sb.auth.signInWithPassword({email,password});else r=await sb.auth.signUp({email,password,options:{data:{display_name:$('name').value.trim()||email.split('@')[0]}}});if(r.error)return $('authMsg').textContent=r.error.message;if(mode==='signup'&&!r.data.session)return $('authMsg').textContent='Check your email to confirm your account, then sign in.';boot();};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function boot(){if(!ready)return;const {data}=await sb.auth.getSession();user=data.session?.user;if(!user)return; $('auth').classList.add('hidden');$('logout').classList.remove('hidden');await loadGroup();}
async function loadGroup(){const {data,error}=await sb.rpc('my_group');if(error||!data?.length){$('welcome').classList.remove('hidden');$('groupBox').innerHTML='<span class="muted">No group yet</span>';return} $('welcome').classList.add('hidden');$('app').classList.remove('hidden');group=data[0];$('groupName').textContent=group.name;$('groupBox').innerHTML='<b>'+esc(group.name)+'</b><span class="pill">ID: '+esc(group.group_code)+'</span><div class="invite" id="invite">'+location.origin+location.pathname+'?invite='+encodeURIComponent(group.invite_code)+'</div>';$('status').textContent='Online';await loadMessages();subscribe();}
async function loadMessages(){const {data}=await sb.from('messages').select('id,body,user_id,created_at,profiles(display_name)').eq('group_id',group.id).order('created_at',{ascending:true}).limit(200);$('messages').innerHTML='';(data||[]).forEach(addMsg);scroll();}
function addMsg(m){const d=document.createElement('div');d.className='msg '+(m.user_id===user.id?'mine':'');d.innerHTML='<b>'+esc(m.profiles?.display_name||'Member')+'</b><br>'+esc(m.body)+'<div class="pill">'+new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div>';$('messages').appendChild(d);}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('group:'+group.id,{config:{private:true}}).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'group_id=eq.'+group.id},payload=>{if(!$('messages').querySelector('[data-id="'+payload.new.id+'"]')){loadMessages();}}).subscribe();}
$('composer').onsubmit=async e=>{e.preventDefault();const body=$('message').value.trim();if(!body||!group)return;const {error}=await sb.from('messages').insert({group_id:group.id,user_id:user.id,body});if(error)alert(error.message);else{$('message').value='';}};
$('joinBtn').onclick=async()=>{const code=$('inviteInput').value.trim();if(!code)return;$('joinMsg').textContent='';const {error}=await sb.rpc('join_group_by_invite',{p_invite_code:code});if(error)$('joinMsg').textContent=error.message;else{await loadGroup();}};
$('createBtn').onclick=async()=>{const name=$('newGroupName').value.trim();if(!name)return;$('joinMsg').textContent='';const {error}=await sb.rpc('create_group',{p_name:name});if(error)$('joinMsg').textContent=error.message;else{await loadGroup();}};
$('copyInvite').onclick=async()=>{if(!group)return;const url=location.origin+location.pathname+'?invite='+encodeURIComponent(group.invite_code);await navigator.clipboard.writeText(url);alert('Private invite copied.');};
function scroll(){$('messages').scrollTop=$('messages').scrollHeight}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
(async()=>{if(ready)boot();else $('authMsg').textContent='Demo shell ready — configure Supabase to enable live internet chat.';})();
</script></body></html>
